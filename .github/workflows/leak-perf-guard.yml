name: Leak & Performance Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]   # any PR TARGETING main, including PRs from forks

# Least-privilege token. pull-requests: write lets the benchmark job post its
# comparison comment on same-repo PRs. contents stays read-only.
permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same ref to save (windows) runner minutes.
concurrency:
  group: leak-perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Gate 1: memory / thread leak soak test (runs on ALL PRs, incl. forks) ----
  backend-leak:
    runs-on: windows-latest        # net10.0-windows + WMI/Windows discovery paths
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/GSSystemAnalyzer.Tests/GSSystemAnalyzer.Tests.csproj
      - name: Soak / leak tests
        run: >
          dotnet test backend/GSSystemAnalyzer.Tests/GSSystemAnalyzer.Tests.csproj
          -c Release --filter Category=Soak --logger "console;verbosity=normal"

  # ---- Gate 3: Flutter widget leak tracking (runs on ALL PRs, incl. forks) ----
  frontend-leak:
    runs-on: ubuntu-latest         # cheap; no Windows-only code exercised here
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        run: flutter pub get
        working-directory: frontend/gs_analyzer_ui
      - name: Flutter tests (leak tracking enabled via test/flutter_test_config.dart)
        run: flutter test
        working-directory: frontend/gs_analyzer_ui

  # ---- Gate 2: CPU / allocation regression (runs on ALL PRs, incl. forks) ----
  # Fork PRs run with a READ-ONLY token: they can READ the baseline cache to compare
  # and still FAIL the check on a regression, but cannot WRITE the cache or post a PR
  # comment. Only push-to-main writes the baseline. Commenting is off so the job never
  # errors on forks; the failing check + job summary carry the signal.
  #
  # This job ALWAYS runs and always reports, even when it has no backend work to do.
  # It is a required status check, and a required check that never reports leaves the
  # PR blocked on a pending state forever — so the path gating is per-STEP (below),
  # never a job-level `if:` or a workflow-level `paths:` filter.
  backend-benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend-only PRs don't touch anything these benchmarks measure. Detect that
      # and skip the expensive steps while still reporting success for the check.
      #
      # PR-event only, deliberately: on pull_request this uses the GitHub API (needs no
      # git history, so the default shallow checkout is fine). On push it would fall
      # back to git-based diffing, which can fail against a fetch-depth:1 clone — and a
      # failure there would break the push-to-main baseline write, which is the whole
      # point of this job. Pushes always benchmark anyway (see the gate below), so the
      # filter has nothing to decide.
      - name: Detect backend changes
        id: filter
        if: github.event_name == 'pull_request'
        continue-on-error: true   # detection breaking must not skip the gate — see below
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/leak-perf-guard.yml'

      # Fail-safe: only skip when the filter POSITIVELY reported no backend changes.
      # Pushes to main always benchmark (that is what refreshes the baseline), and a
      # filter that errored leaves the output empty, which falls through to run=true.
      # Skipping a regression gate because detection broke is the one outcome to avoid.
      - name: Decide whether to benchmark
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.backend }}" = "false" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes — skipping CPU/allocation benchmark." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.gate.outputs.run == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Run BenchmarkDotNet (JSON exporter)
        if: steps.gate.outputs.run == 'true'
        run: >
          dotnet run -c Release --framework net10.0-windows
          --project backend/GSSystemAnalyzer.Benchmarks/GSSystemAnalyzer.Benchmarks.csproj
          -- --exporters json --filter '*'

      # RESTORE ONLY. A plain `actions/cache` step here caused the bug this replaces:
      # its key is immutable, so the first run on a ref saved a baseline and every later
      # run on that same ref restored it and compared the PR against ITSELF (a PR is
      # scoped to its own refs/pull/N/merge cache before falling back to main). Two runs
      # of one branch on different runners then read as a 2x "regression". Restoring with
      # a per-SHA key + prefix fallback, and saving only on main, makes a PR always
      # measure against main and never against its own earlier run.
      - name: Restore benchmark baseline
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ./cache
          key: benchmark-baseline-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            benchmark-baseline-${{ runner.os }}-

      - name: Compare against baseline & fail on regression
        if: steps.gate.outputs.run == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'benchmarkdotnet'
          # github-action-benchmark does not expand globs, so we provide the exact filename.
          output-file-path: BenchmarkDotNet.Artifacts/results/GSSystemAnalyzer.Benchmarks.ScannerBenchmarks-report-full-compressed.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          fail-on-alert: true
          # 300%, not 150%. ScannerBenchmarks are I/O-bound — ResolveCleanTargets() is
          # ~15 Directory.Exists calls plus Directory.GetDirectories against whatever
          # happens to be installed on the runner image, with no caching. Observed
          # run-to-run spread on identical code is ~2x, so 150% fails on runner luck
          # alone. Proper fix is a seeded, deterministic temp tree via [GlobalSetup] in
          # ScannerBenchmarks.cs; until then this threshold catches order-of-magnitude
          # regressions without crying wolf.
          alert-threshold: '300%'
          comment-on-alert: false      # forks can't comment; failing check + summary cover it
          summary-always: true

      # Only pushes to main roll the baseline forward, so PR runs can never poison it.
      # Must come AFTER the compare step, which is what appends the new data point.
      - name: Save benchmark baseline
        if: steps.gate.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ./cache
          key: benchmark-baseline-${{ runner.os }}-${{ github.sha }}

  # ---- Optional: Discord ping on any gate failure (matches your other workflows) ----
  notify:
    needs: [backend-leak, frontend-leak, backend-benchmark]
    if: always() && (needs.backend-leak.result == 'failure' || needs.frontend-leak.result == 'failure' || needs.backend-benchmark.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Discord failure notification
        continue-on-error: true   # fork PRs have no DISCORD_WEBHOOK secret; never fail the run on this
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.CI_BUILD }}
          status: failure
          title: "Leak & Performance Guard failed"
          description: "A leak/perf gate failed on ${{ github.ref_name }} (${{ github.sha }})."
