name: GS Engine Benchmark (PR)

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  run-benchmarks:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        suite: [Storage, Memory, Processing, Hardware]

    name: Suite - ${{ matrix.suite }}

    steps:
      - name: Checkout Core (PR code)
        uses: actions/checkout@v4
        with:
          path: core

      - name: Checkout Benchmark Repo
        uses: actions/checkout@v4
        with:
          repository: GS-SystemAnalyzer/gs-benchmark
          path: gs-benchmarks

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Execute ${{ matrix.suite }} Benchmarks
        env:
          CoreRepoPath: ${{ github.workspace }}\core
        working-directory: .\gs-benchmarks\GSAnalyzer.Benchmarks
        run: dotnet run -c Release -- --filter "*GSAnalyzer.Benchmarks.Suites.${{ matrix.suite }}.*" --exporters json github

      - name: Collect results + PR metadata
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $results = ".\gs-benchmarks\GSAnalyzer.Benchmarks\BenchmarkDotNet.Artifacts\results"
          if (Test-Path $results) { Copy-Item -Recurse -Force "$results\*" artifact\ }
          # Persist the PR number so the report workflow can reference it.
          # (workflow_run.pull_requests is empty for fork PRs, so we carry it here.)
          "${{ github.event.pull_request.number }}" | Out-File -Encoding ascii artifact\pr-number.txt
          "${{ github.event.pull_request.head.repo.full_name }}" | Out-File -Encoding ascii artifact\pr-repo.txt

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.suite }}
          path: artifact
          retention-days: 7
