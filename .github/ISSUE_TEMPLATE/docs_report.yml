name: Documentation
description: Something in the docs is wrong, missing, or unclear.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: where
    attributes:
      label: Where?
      description: File/section (CONTRIBUTING.md, README, PRD, etc.) with a link if possible.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
