name: Performance / memory issue
description: Report a regression or optimization opportunity (footprint, scan time, allocations).
title: "[Perf]: "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        Back performance claims with numbers where you can (BenchmarkDotNet, dotnet-counters, dotnet-gcdump).
  - type: textarea
    id: symptom
    attributes:
      label: What's slow or heavy?
      description: e.g. cache footprint, ClearCache not returning to idle, scan time, high allocations.
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Measurements
      description: Paste benchmark rows or counter output (Mean, Allocated, residual bytes, etc.).
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Storage / disk scan
        - Memory / caching
        - Processing
        - Hardware / sensors
        - Other
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: Dataset / conditions
      placeholder: "e.g. 40,000 files, warm cache, Windows 11"
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: Numbers came from a measurement tool, not estimation
